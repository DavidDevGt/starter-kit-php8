name: CI

on:
  push:
    branches: ["main", "claude/**", "infra/**", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

# ── Shared CI-only DB credentials ────────────────────────────────────────────
# Override these in GitHub → Settings → Secrets for extra isolation,
# but the defaults below are safe for ephemeral CI containers.
env:
  CI_DB_NAME: starter_kit_test
  CI_DB_USER: ${{ secrets.TEST_DB_USER || 'ci_user' }}
  CI_DB_PASS: ${{ secrets.TEST_DB_PASSWORD || 'ci_secret_pass' }}
  CI_DB_ROOT: ${{ secrets.TEST_DB_ROOT_PASSWORD || 'ci_root_pass' }}

jobs:
  # ── Static analysis ──────────────────────────────────────────────────────────
  analyse:
    name: PHPStan (level 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, redis, opcache, intl, zip, bcmath, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Security audit
        run: composer audit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  # ── Unit & feature tests ─────────────────────────────────────────────────────
  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_ROOT }}
          MYSQL_DATABASE: ${{ env.CI_DB_NAME }}
          MYSQL_USER: ${{ env.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ env.CI_DB_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=${{ env.CI_DB_ROOT }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, redis, opcache, intl, zip, bcmath, mbstring
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        env:
          APP_ENV: testing
          APP_KEY: ci-app-key-not-used-in-tests-00000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.CI_DB_NAME }}
          DB_USER: ${{ env.CI_DB_USER }}
          DB_PASS: ${{ env.CI_DB_PASS }}
        run: php database/migrate.php run

      - name: Run tests
        env:
          APP_ENV: testing
          APP_KEY: ci-app-key-not-used-in-tests-00000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.CI_DB_NAME }}
          DB_USER: ${{ env.CI_DB_USER }}
          DB_PASS: ${{ env.CI_DB_PASS }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit --coverage-text

  # ── Docker build validation ──────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: starter-kit-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
